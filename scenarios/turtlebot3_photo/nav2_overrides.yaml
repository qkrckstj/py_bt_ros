# Common mission settings. compat.py selects velocity types and controller limits.
amcl:
  ros__parameters:
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}
controller_server:
  ros__parameters:
    general_goal_checker:
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
local_costmap:
  local_costmap:
    ros__parameters:
      robot_radius: 0.105
global_costmap:
  global_costmap:
    ros__parameters:
      robot_radius: 0.105
velocity_smoother:
  ros__parameters:
    max_velocity: [0.22, 0.0, 1.0]
    min_velocity: [-0.15, 0.0, -1.0]
planner_server:
  ros__parameters:
    GridBased:
      # A 0.5 m fallback goal can violate the separate BT arrival check.
      tolerance: 0.05
