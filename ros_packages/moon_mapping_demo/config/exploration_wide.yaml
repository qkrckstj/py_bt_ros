# 적극 탐사: 짧은 관측·국소 탈출 예상으로 정지 여유를 줄인 3364 m² 평가 프로필.
robots:
- robot1
- robot2
- robot3
- robot4
goals:
- id: goal_a
  x: -26.0
  y: -21.5
- id: goal_b
  x: -22.5
  y: -26.0
- id: goal_c
  x: -22.0
  y: -23.0
- id: goal_d
  x: -27.5
  y: -26.0
planner:
  resolution: 0.5
  time_step: 0.5
  speed: 0.18
  robot_radius: 0.22
  horizon: 180.0
  safety_time_step: 0.1
  direct_goal_links: true
terrain_height_threshold: 0.001
terrain_geometry: mesh
shadow_plane_height: 0.02
execution:
  lead_seconds: 7.0
  goal_hold_seconds: 7.0
  position_tolerance: 0.18
  goal_tolerance: 0.05
  delay_tolerance: 2.0
  odom_timeout: 0.6
  input_wall_timeout: 3.0
  lookahead_seconds: 0.3
  control_period: 0.1
  max_replans: 10
exploration:
  evaluation:
    xmin: -29.0
    ymin: -29.0
    xmax: 29.0
    ymax: 29.0
    resolution: 0.25
  sensor_range_m: 6.0
  coverage_target: 0.85
  max_sim_seconds: 1800.0
  max_rounds: 100
  observe_seconds: 4.0
  finish_round_after_observation: true
  allow_partial_escape: true
  arrival_window_escape: true
  short_escape_hold: true
  bootstrap_seconds: 7.0
  minimum_observation_frames: 3
  observation_angular_speed: 0.5
  sensor_timeout_seconds: 2.0
  planning_wall_budget_seconds: 8.0
  planning_result_margin_seconds: 0.4
  max_assignment_attempts: 24
  target_step_m: 4.0
  progressive_goals: true
  spatial_regions: true
  allow_region_support: true
  region_spacing_m: 6.0
  region_continuity_weight: 1.5
  turn_aware_coordination: true
  candidate_limit: 12
  max_path_seconds: 45.0
  minimum_goal_distance_m: 0.8
  goal_separation_m: 1.0
  minimum_potential_gain_m2: 0.5
  max_frontiers: 64
  stationary_safety_horizon: 20.0
  safety_lead_seconds: 3.0
  retry_seconds: 3.0
  max_planning_failures: 3
  stagnation_seconds: 120.0
  complete_hold_seconds: 1.0
  safety_target_horizon: 60.0

# 4대 Hungarian 배정 뒤 공동 경로의 출발 정책. 기존 동시 정책을 기본으로 보존.
departure:
  mode: simultaneous  # staggered_pairs로 선발 2대·후발 2대 선택
  clearance_distance_m: 1.0
  delay_candidates_seconds: [0.0, 2.0, 4.0, 8.0]
  max_schedule_attempts: 24
  staging_distance_m: 0.75

# 기본 출발 정책은 simultaneous. 회전 상태 탐색은 risk_stage:=heading으로 비교.
risk:
  enabled: true
  safe_goal_windows: true
  multiple_escape_candidates: true
  heading_planner: false
  forecast_seconds: 90.0
  check_period_seconds: 0.5
  planning_sim_budget_seconds: 5.0
  swap_seconds: 0.5
  preparation_seconds: 1.0
  escape_distance_estimate_m: 2.5
  turn_rate: 0.5
  margin_seconds: 3.0
  followup_wait_seconds: 12.0
  warning_position_margin_m: 0.02
  escape_candidates_per_robot: 3
  escape_candidate_sets: 8
